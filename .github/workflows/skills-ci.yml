name: skills-ci
on:
  push: { branches: [ main, 'integration/vibe-release-*' ] }
  pull_request:
jobs:
  skills-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Skills quality gate (lint + evals + description score, both roots)
        run: python3 .github/skill-ci/run_ci.py
      - name: QA acceptance evidence regressions (offline fixtures only)
        run: python3 -B -m unittest discover -s skills-src/qa/scripts -p test_qa_gate.py -q
      - name: Offline benchmark freshness regressions (no network or real Wiki)
        run: python3 -m unittest discover -s scripts/tests -p test_fetch_model_benchmarks.py
      - name: Offline model release watch regressions (no network or model calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_model_watch.py -q
      - name: Offline Grok runtime metadata regressions (no network or model calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_runtime_collect.py -q
      - name: Offline model registry regressions (no network or model calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_model_registry.py -q
      - name: Offline vibe orchestration regressions (no model, image or Bot calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_orchestrate.py -q
      - name: Offline vibe run-state regressions (no model, image or Bot calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_run_state.py -q
      - name: Offline Claude CLI adapter regressions (fake transport; no model calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_execute_cli.py -q
      - name: Offline Codex CLI adapter regressions (fake transport; no model calls)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_execute_codex_cli.py -q
      - name: Offline tooling option safety regressions (no Orca or registry access)
        run: python3 -B -m unittest discover -s skills-src/vibe/scripts -p test_check_tooling.py -q
      - name: ai-debate runner regressions
        run: python3 -B -m unittest discover -s skills-src/ai-debate/scripts -p 'test_*.py' -q
      - name: Source-only release fence regressions (no home install or model calls)
        run: python3 -B -m unittest discover -s scripts/tests -p test_main_release_fence.py -q
  candidate-path-audit-windows:
    # The guarded package reader intentionally rejects non-Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Candidate static path audit regressions (fixtures only)
        run: python -B -m unittest discover -s scripts/tests -p test_candidate_path_audit.py
      - name: QA acceptance evidence paths on Windows (offline fixtures only)
        run: python -B -m unittest discover -s skills-src/qa/scripts -p test_qa_gate.py -q
      - name: Vibe host preflight regressions (Python 3.11; no profile changes)
        run: python -B -m unittest discover -s scripts/tests -p test_vibe_host_preflight.py -q
      - name: Vibe flat-link rehearsal and rollback (isolated temp profile only)
        run: python -B -m unittest discover -s scripts/tests -p test_vibe_flat_transition.py -q
      - name: Windows update-local installer (temp homes only; no build or model calls)
        run: python -B -m unittest discover -s scripts/tests -p test_windows_update_local.py -q
