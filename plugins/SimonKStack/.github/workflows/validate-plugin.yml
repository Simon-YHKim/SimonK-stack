name: validate-plugin
on:
  push: { branches: [ main, plugin/simonk-stack ] }
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: node .github/validate.mjs
      - run: node .github/validate-evals.mjs
      - run: node --test .github/validate-evals.test.mjs
      - run: node --test skills/analytics-ad-wiring/tests/consent-gated-wrapper.test.mjs
