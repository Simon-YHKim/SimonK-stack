<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIHub 활성 스킬 모델 표기 감사</title><style>:root{color-scheme:light dark;--a:#176a9a;--t:#172331;--m:#566573;background:#f5f8fa;color:var(--t);font:16px/1.5 system-ui,sans-serif}@media(prefers-color-scheme:dark){:root{--a:#7bc5f3;--t:#e9f1f7;--m:#a6b7c4;background:#101820}}body{max-width:760px;margin:auto;padding:2rem}h1{line-height:1.2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem}.cards p,details{border:1px solid var(--m);border-radius:.7rem;padding:1rem}.cards strong{display:block;font-size:1.4rem;color:var(--a)}small{color:var(--m)}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}summary:focus-visible{outline:3px solid var(--a)}</style></head><body><small>2026-09-29 11:55:14 KST · 추가 과금 $0</small><h1>AIHub 활성 스킬 모델 표기 교정</h1><p>제품용 모델 선택은 <code>ai-model-selector</code>로 모으고, 내부 <code>model-router</code>와 분리했다. 고정된 구형 모델명·가짜 API ID를 활성 스킬의 예시에서 제거했다.</p><div class="cards"><p><strong>7/7</strong>스킬 품질 게이트</p><p><strong>0</strong>지정 구형 모델 문자열</p><p><strong>0</strong>모델/API 실호출</p></div><details><summary>아직 남은 통합</summary><p>AIHub 원본 기능 브랜치를 SimonK-stack 후보에 핀·재빌드하고 전체 회귀 검증해야 한다. main 머지와 설치 전환은 하지 않았다.</p></details></body></html>
