<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>작업 이관 보고서</title>
<style>
  body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; padding: 20px; line-height: 1.6; }
  h1, h2 { color: #FF5555; font-weight: normal; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; }
  th, td { border: 1px solid #333333; padding: 10px; text-align: left; }
  th { background-color: #1E1E1E; }
  button { background-color: #FF5555; color: #121212; border: none; padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
  <h1>작업 이관 보고서</h1>
  <p>현재 사이클의 보안 제약사항 및 역할 분리로 인하여 해당 코드 수정 작업을 수행할 수 없습니다.</p>
  
  <h2>이관 대상 작업</h2>
  <table>
    <thead>
      <tr>
        <th>작업 참조</th>
        <th>요청 내용</th>
        <th>제약 검토 결과 (섹션 35)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>20260605-235037</td>
        <td>리스트 가상화 버그 수정 및 브랜치 푸시</td>
        <td>쓰기 권한 제한 및 외부 저장소 푸시 불가</td>
      </tr>
    </tbody>
  </table>
  
  <p>첨부된 사진이나 영상으로 검증하는 작업 또한 헤드리스 환경으로 인해 불가능합니다.</p>

  <div style="margin-top: 20px;">
    <button>보고서 닫기</button>
  </div>
</body>
</html>
