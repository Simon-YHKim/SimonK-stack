<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>QA 진실성 에스컬레이션 보고서</title>
    <style>
        body {
            background-color: #121212;
            color: #E0E0E0;
            font-family: sans-serif;
            margin: 2rem;
            line-height: 1.6;
        }
        h1, h2 {
            color: #FFFFFF;
        }
        .container {
            border: 1px solid #333333;
            padding: 1.5rem;
            background-color: #1E1E1E;
        }
        .meta {
            color: #A0A0A0;
            font-size: 0.9em;
            margin-bottom: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid #333333;
            padding: 0.75rem;
            text-align: left;
        }
        th {
            background-color: #2A2A2A;
            color: #FFFFFF;
        }
        button {
            background-color: #333333;
            color: #FFFFFF;
            border: 1px solid #555555;
            padding: 0.5rem 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>작업 반려 및 에스컬레이션 보고서</h1>
        <div class="meta">작성일시: 2026-07-15 16:56:08 KST</div>
        <p>요청된 에뮬레이터 환경에서의 APK 설치 및 UI 테스트 작업은 현재 헤드리스 데몬 환경의 제약으로 인해 수행할 수 없습니다.</p>
        
        <h2>상세 사유</h2>
        <table>
            <thead>
                <tr>
                    <th>항목</th>
                    <th>상태 및 사유</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>에뮬레이터 상태</td>
                    <td>실행 중인 프로세스 없음</td>
                </tr>
                <tr>
                    <td>디바이스 연결</td>
                    <td>연결된 디바이스 없음</td>
                </tr>
                <tr>
                    <td>보안 및 비용 제약</td>
                    <td>로그인 시크릿 접근 제약</td>
                </tr>
                <tr>
                    <td>진실성 원칙</td>
                    <td>실제 테스트 없이 결과 위조 불가</td>
                </tr>
            </tbody>
        </table>
        
        <p>이에 따라 해당 작업을 권한이 있는 담당자에게 반려합니다.</p>
        <button type="button">확인</button>
    </div>
</body>
</html>
