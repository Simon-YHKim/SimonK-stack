<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>안드로이드 에뮬레이터 검증 실패 보고</title>
<style>
    body { background-color: #000000; color: #ffffff; font-family: sans-serif; margin: 40px; line-height: 1.6; }
    h1, h2 { border-bottom: 1px solid #444444; padding-bottom: 5px; }
    .box { background-color: #000000; padding: 15px; border: 1px solid #444444; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #444444; padding: 10px; text-align: left; }
    th { background-color: #444444; color: #ffffff; }
    code { font-family: monospace; }
</style>
</head>
<body>
    <h1>안드로이드 에뮬레이터 검증 실패 보고</h1>
    <div class="box">
        설치용 안드로이드 앱 패키지 다운로드 주소가 만료되어 검증을 진행할 수 없습니다. 에뮬레이터 단말기 부팅은 정상적으로 완료되었습니다.
    </div>
    
    <h2>세부 내역</h2>
    <table>
        <tr>
            <th>검사 항목</th>
            <th>결과</th>
        </tr>
        <tr>
            <td>에뮬레이터 부팅</td>
            <td>성공</td>
        </tr>
        <tr>
            <td>앱 패키지 다운로드</td>
            <td>실패 (접근 불가)</td>
        </tr>
        <tr>
            <td>후속 조치</td>
            <td>요청 거절 및 재요청 대기</td>
        </tr>
    </table>
</body>
</html>
