<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>작업 에스컬레이션 보고서</title>
<style>
  body {
    background-color: #000000;
    color: #FFFFFF;
    font-family: sans-serif;
    margin: 40px auto;
    max-width: 800px;
    line-height: 1.6;
  }
  h1, h2 {
    color: #FFFFFF;
    border-bottom: 1px solid #333333;
    padding-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #333333;
    padding: 12px;
    text-align: left;
  }
  th {
    background-color: #333333;
    color: #FFFFFF;
  }
  button {
    background-color: #333333;
    color: #FFFFFF;
    border: 1px solid #FFFFFF;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 20px;
  }
  button:hover {
    background-color: #000000;
  }
</style>
</head>
<body>
  <h1>오류 및 에스컬레이션 보고서</h1>
  <h2>작업 내역</h2>
  <table>
    <thead>
      <tr>
        <th>항목</th>
        <th>내용</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>작업 대상</td>
        <td>기능 에뮬레이터 검증 (0.0.7 APK)</td>
      </tr>
      <tr>
        <td>실패 사유</td>
        <td>가용한 에뮬레이터 프로세스 및 안드로이드 디바이스 없음</td>
      </tr>
      <tr>
        <td>조치 사항</td>
        <td>QA-truthfulness 규칙에 따른 작업 중단 및 에스컬레이션</td>
      </tr>
    </tbody>
  </table>
  <h2>상세 내용</h2>
  <p>헤드리스 텍스트 환경으로 인하여 앱 설치 및 화면 캡처가 불가합니다. 허위 결과를 생성하지 않고 작업을 중단합니다.</p>
  <button type="button">확인 완료</button>
</body>
</html>
