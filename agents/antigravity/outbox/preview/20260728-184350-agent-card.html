<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>작업 보고서: 에이전트 카드 생성</title>
<style>
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: sans-serif;
    line-height: 1.6;
    margin: 40px auto;
    max-width: 800px;
    padding: 0 20px;
  }
  h1, h2, h3 {
    color: #ffffff;
    border-bottom: 1px solid #333333;
    padding-bottom: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #333333;
    padding: 10px;
    text-align: left;
  }
  th {
    background-color: #1e1e1e;
    color: #ffffff;
  }
  button {
    background-color: #333333;
    color: #ffffff;
    border: 1px solid #555555;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover {
    background-color: #444444;
  }
  .container {
    background-color: #1e1e1e;
    padding: 20px;
    border-radius: 4px;
  }
  a {
    color: #a0a0a0;
  }
</style>
</head>
<body>
  <h1>작업 보고서</h1>
  
  <div class="container">
    <h2>개요</h2>
    <p>요청된 에이전트 카드 (A2A 매니페스트) 생성 작업을 완료했습니다. 스크립트를 통해 스킬 배열 및 모델 정보를 추출하여 JSON 파일로 저장했습니다.</p>

    <h2>작업 내역</h2>
    <table>
      <thead>
        <tr>
          <th>항목</th>
          <th>값</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>대상 파일</td>
          <td>agents/antigravity/agent-card.json</td>
        </tr>
        <tr>
          <td>상태</td>
          <td>완료</td>
        </tr>
        <tr>
          <td>실행 도구</td>
          <td>tools/gen-agent-card.ps1</td>
        </tr>
        <tr>
          <td>적용 모델</td>
          <td>Gemini 3.1 Pro (High)</td>
        </tr>
      </tbody>
    </table>

    <div style="margin-top: 20px;">
      <button onclick="alert('세부 정보는 로그를 참조하십시오.')">로그 확인</button>
    </div>
  </div>
</body>
</html>
