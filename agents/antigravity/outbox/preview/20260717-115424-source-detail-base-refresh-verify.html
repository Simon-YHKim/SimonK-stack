<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>기록 상세 기준점 갱신 교차 검증 보고서</title>
<style>
  body { background-color: #121212; color: #E0E0E0; font-family: monospace; padding: 20px; line-height: 1.6; margin: 0; }
  h1, h2 { color: #E0E0E0; border-bottom: 1px solid #E0E0E0; padding-bottom: 5px; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; border: 1px solid #E0E0E0; }
  th, td { border: 1px solid #E0E0E0; padding: 10px; text-align: left; }
  th { background-color: #1e1e1e; }
  .success { color: #76FF03; font-weight: bold; }
  .section { margin-top: 30px; }
</style>
</head>
<body>
  <h1>검증 결과 보고서</h1>
  
  <div class="section">
    <p>요청된 브랜치 코드베이스에 대한 정적 검증을 완료했습니다.</p>
  </div>

  <div class="section">
    <table>
      <thead>
        <tr>
          <th>검증 항목</th>
          <th>상태</th>
          <th>비고</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>조상 이력 확인</td>
          <td class="success">통과</td>
          <td>기존 해시 조상으로 확인 완료</td>
        </tr>
        <tr>
          <td>경로 함수 호출 확인</td>
          <td class="success">통과</td>
          <td>내부 함수 경로 유지 완료</td>
        </tr>
        <tr>
          <td>진입점 접근 제어 확인</td>
          <td class="success">통과</td>
          <td>편집, 이동, 삭제, 태그 제어 차단 완료</td>
        </tr>
        <tr>
          <td>상세 화면 분리 확인</td>
          <td class="success">통과</td>
          <td>일반 기록 화면과 분리 작동 확인 완료</td>
        </tr>
        <tr>
          <td>로컬 상태 확인</td>
          <td class="success">통과</td>
          <td>외부 저장소 푸시 및 병합 없음</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
