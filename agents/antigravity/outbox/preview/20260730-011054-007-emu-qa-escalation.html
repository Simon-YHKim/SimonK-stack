<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>에뮬레이터 QA 테스트 결과</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h2 {
            color: #ffffff;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333333;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #1e1e1e;
            color: #ffffff;
        }
        .error-message {
            background-color: #1e1e1e;
            padding: 15px;
            border-left: 4px solid #888888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>에뮬레이터 QA 결과 보고</h1>
    <p>오더 대상: 0.0.7 네이티브 앱 (EAS 배포판)</p>
    
    <h2>상태: 진행 불가 (에스컬레이션)</h2>
    <div class="error-message">
        <p>요청된 APK 파일을 다운로드할 수 없습니다. S3/EAS 버킷에서 접근 거부 또는 키 없음(NoSuchKey) 오류가 반환되었습니다.</p>
        <p>환경 제한으로 인해 QA 계정 로그인 등 상호작용 UI 검증은 불가하며, 클로드에게 에스컬레이션 조치합니다.</p>
    </div>

    <h2>세부 내역</h2>
    <table>
        <thead>
            <tr>
                <th>항목</th>
                <th>상태</th>
                <th>비고</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>APK 다운로드</td>
                <td>실패</td>
                <td>NoSuchKey 반환됨</td>
            </tr>
            <tr>
                <td>에뮬레이터 설치</td>
                <td>취소됨</td>
                <td>다운로드 실패로 인한 중단</td>
            </tr>
            <tr>
                <td>화면 캡처</td>
                <td>취소됨</td>
                <td>실행 불가</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
