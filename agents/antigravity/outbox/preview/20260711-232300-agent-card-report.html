<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>보고서: 에이전트 카드 생성</title>
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; margin: 2rem; }
        h1, h2 { color: #FFFFFF; border-bottom: 1px solid #333333; padding-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #333333; padding: 0.75rem; text-align: left; }
        th { background-color: #1E1E1E; color: #FFFFFF; }
        button { background-color: #333333; color: #FFFFFF; border: none; padding: 0.5rem 1rem; cursor: pointer; }
        button:hover { background-color: #555555; }
        .caption { font-size: 0.85rem; color: #A0A0A0; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <h1>보고서: 에이전트 카드 생성</h1>
    <h2>작업 개요</h2>
    <p>오케스트레이터의 요청에 따라 머신 리더블 매니페스트인 에이전트 카드를 생성하였습니다. 해당 카드는 자동 라우팅 시스템 통합을 지원합니다.</p>
    
    <h2>생성된 명세</h2>
    <table>
        <thead>
            <tr>
                <th>항목</th>
                <th>내용</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>보유 기술</td>
                <td>안드로이드 네이티브, 구글 네이티브, 에뮬레이터 검증, 디바이스 검증, 성능, 크래시 분석, 멀티모달 렌더링</td>
            </tr>
            <tr>
                <td>현재 모델</td>
                <td>제미나이 3.1 프로</td>
            </tr>
            <tr>
                <td>상태</td>
                <td>활성</td>
            </tr>
        </tbody>
    </table>
    <div class="caption">표 1: 에이전트 카드 매니페스트 요약</div>
    
    <div style="margin-top: 2rem;">
        <button type="button">상세 기록 닫기</button>
    </div>
</body>
</html>
