<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>사이클 통합 사실 검증 보고서</title>
<style>
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: sans-serif;
    margin: 40px;
    line-height: 1.6;
  }
  h1, h2, h3 {
    color: #ffffff;
    border-bottom: 1px solid #333333;
    padding-bottom: 5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  th, td {
    border: 1px solid #333333;
    padding: 10px;
    text-align: left;
  }
  th {
    background-color: #1e1e1e;
  }
</style>
</head>
<body>
  <h1>사이클 통합 사실 검증 보고서</h1>
  
  <h2>개요</h2>
  <p>요청된 두 가지 기술적 사실에 대한 검증 결과를 보고합니다.</p>

  <h2>검증 결과</h2>
  <table>
    <thead>
      <tr>
        <th>항목</th>
        <th>내용</th>
        <th>결과</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>실질 변경 중 원격에 없는 브랜치는 단 한 개다.</td>
        <td>거짓</td>
      </tr>
      <tr>
        <td>2</td>
        <td>지정된 경로의 단위 테스트가 모두 통과한다.</td>
        <td>참</td>
      </tr>
    </tbody>
  </table>

  <h2>상세 내용</h2>
  <h3>항목 일: 원격 누락 브랜치</h3>
  <p>로컬 저장소 검사 결과 원격에 푸시되지 않은 브랜치가 총 열한 개 발견되었습니다.</p>

  <h3>항목 이: 테스트 실행</h3>
  <p>작업 트리의 해당 브랜치에서 지정된 세계관 명명 규칙 테스트를 실행한 결과, 열세 개의 항목이 모두 통과했습니다.</p>
</body>
</html>
