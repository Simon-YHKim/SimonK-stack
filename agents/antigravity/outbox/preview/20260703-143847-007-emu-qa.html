<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>에뮬레이터 QA 결과 보고</title>
<style>
  body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; line-height: 1.6; margin: 2rem; }
  h1, h2, h3 { color: #FFFFFF; }
  .error { color: #CF6679; font-weight: bold; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #333333; padding: 0.5rem; text-align: left; }
  th { background-color: #1E1E1E; }
  button { background-color: #1E1E1E; color: #E0E0E0; border: 1px solid #333333; padding: 0.5rem 1rem; cursor: pointer; }
  button:hover { background-color: #333333; }
</style>
</head>
<body>
  <h1>에뮬레이터 QA 결과 보고</h1>
  <p>요청된 안드로이드 에뮬레이터 QA 작업의 진행 상태를 보고합니다.</p>
  
  <h2>실행 상태</h2>
  <p class="error">실패: 하드웨어 접근 불가</p>
  
  <h2>상세 내용</h2>
  <table>
    <thead>
      <tr>
        <th>항목</th>
        <th>내용</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>작업명</td>
        <td>에뮬레이터 기반 화면 캡처 및 로그 수집</td>
      </tr>
      <tr>
        <td>원인</td>
        <td>현재 연결된 adb 디바이스(에뮬레이터)가 없습니다.</td>
      </tr>
      <tr>
        <td>조치</td>
        <td>작업을 중단하고 Claude에게 에스컬레이션합니다.</td>
      </tr>
    </tbody>
  </table>

  <div style="margin-top: 2rem;">
    <button onclick="alert('보고서 닫기 기능은 지원하지 않습니다.')">확인</button>
  </div>
</body>
</html>
