<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록 상세 브랜치 재정렬 교차 검증 보고서</title>
<style>
  body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; margin: 0; padding: 20px; }
  h1, h2 { color: #E0E0E0; border-bottom: 1px solid #333333; padding-bottom: 5px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #333333; padding: 10px; text-align: left; }
  th { background-color: #333333; }
</style>
</head>
<body>
  <h1>기록 상세 브랜치 재정렬 교차 검증 보고서</h1>
  <table>
    <tr>
      <th>검증 항목</th>
      <th>결과</th>
    </tr>
    <tr>
      <td>조상 관계 확인</td>
      <td>통과</td>
    </tr>
    <tr>
      <td>출처 보존 확인</td>
      <td>통과</td>
    </tr>
    <tr>
      <td>폴백 처리 확인</td>
      <td>통과</td>
    </tr>
    <tr>
      <td>전용 액션 숨김 확인</td>
      <td>통과</td>
    </tr>
    <tr>
      <td>인가되지 않은 배포 확인</td>
      <td>통과 (발견 없음)</td>
    </tr>
  </table>
  <h2>검토 의견</h2>
  <p>요청된 모든 항목에 대해 교차 검증을 수행하였으며, 코드 무결성이 확인되었습니다.</p>
</body>
</html>
