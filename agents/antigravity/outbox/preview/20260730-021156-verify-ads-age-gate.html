<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>분석 게이트 교차 검증 보고서</title>
<style>
  body { background-color: #111111; color: #EEEEEE; font-family: sans-serif; margin: 2rem; }
  h1, h2, h3 { color: #EEEEEE; font-weight: bold; }
  .accent { color: #888888; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #888888; padding: 0.75rem; text-align: left; }
  th { background-color: #111111; color: #EEEEEE; }
  button { background-color: #888888; color: #111111; border: none; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; }
  .section { margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #888888; }
</style>
</head>
<body>
  <h1>분석 게이트 교차 검증 보고서</h1>
  <div class="section">
    <h2>요약</h2>
    <p>분석 및 연령 게이트의 안전성을 검증했습니다.</p>
    <button>자세히 보기</button>
  </div>
  <div class="section">
    <h2>검증 결과</h2>
    <table>
      <thead>
        <tr>
          <th>검증 항목</th>
          <th>결과</th>
          <th>비고</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>병합 거부 타당성</td>
          <td class="accent">타당함</td>
          <td>기존 후보 커밋은 최신 보안 기능을 누락시킬 위험이 존재합니다.</td>
        </tr>
        <tr>
          <td>현재 보호 체계 강도</td>
          <td class="accent">더 강함</td>
          <td>서버 검증 및 런타임 차단 기능은 클라이언트 단독 검증보다 안전합니다.</td>
        </tr>
        <tr>
          <td>추가 위험 요소</td>
          <td class="accent">확인됨</td>
          <td>초기화 전 동의 확인 필수, 아이피 주소 수집 방지 체계 확인이 필요합니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="section">
    <h2>결론</h2>
    <p>코드 및 개인정보 보호 관점에서 판단이 정확하며, 현재의 보호 체계를 유지하는 것을 권장합니다.</p>
  </div>
</body>
</html>
