<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>QA 결과: 레코드 소스 상세 라우팅</title>
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; padding: 20px; }
        h1, h2 { color: #FFFFFF; border-bottom: 1px solid #333333; padding-bottom: 5px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #444444; padding: 10px; text-align: left; }
        th { background-color: #1E1E1E; }
        .summary { background-color: #1E1E1E; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .success { color: #4CAF50; font-weight: bold; }
        button { background-color: #333333; color: #FFFFFF; border: 1px solid #555555; padding: 10px 20px; cursor: pointer; }
        button:hover { background-color: #444444; }
    </style>
</head>
<body>
    <h1>QA 검증 보고서</h1>
    <div class="summary">
        <p><strong>요청:</strong> 레코드 소스 상세 라우팅 갱신 (02:43 기준)</p>
        <p><strong>상태:</strong> <span class="success">통과</span></p>
    </div>
    <h2>검증 상세 내용</h2>
    <table>
        <thead>
            <tr>
                <th>검증 항목</th>
                <th>결과</th>
                <th>비고</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>네이티브 회귀 위험</td>
                <td class="success">없음</td>
                <td>변경된 파일에 안드로이드 네이티브 코드가 포함되지 않음</td>
            </tr>
            <tr>
                <td>단위 테스트</td>
                <td class="success">통과 (5/5)</td>
                <td>모든 라우팅 조건 충족</td>
            </tr>
            <tr>
                <td>타입 검사</td>
                <td class="success">통과</td>
                <td>TypeScript 컴파일 오류 없음</td>
            </tr>
        </tbody>
    </table>
    <div style="margin-top: 20px;">
        <button onclick="window.close()">창 닫기</button>
    </div>
</body>
</html>
