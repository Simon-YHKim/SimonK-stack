<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>작업 보고서</title>
<style>
  body {
    background-color: #121212;
    color: #e0e0e0;
    font-family: sans-serif;
    margin: 40px;
    line-height: 1.6;
  }
  h1, h2 {
    color: #ffffff;
    border-bottom: 1px solid #333333;
    padding-bottom: 8px;
  }
  .accent {
    color: #4caf50;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #333333;
    padding: 12px;
    text-align: left;
  }
  th {
    background-color: #1e1e1e;
    color: #ffffff;
  }
  .button-container {
    margin-top: 20px;
  }
  button {
    background-color: #333333;
    color: #ffffff;
    border: 1px solid #4caf50;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background-color: #4caf50;
    color: #121212;
  }
</style>
</head>
<body>
  <h1>작업 보고서</h1>
  <p>상태: <span class="accent">완료</span></p>

  <h2>작업 내역</h2>
  <p>지시받은 대로 에이전트 카드 매니페스트를 성공적으로 생성하고 저장했습니다.</p>
  
  <table>
    <thead>
      <tr>
        <th>항목</th>
        <th>상세 내용</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>작업 파일</td>
        <td>agents/antigravity/agent-card.json</td>
      </tr>
      <tr>
        <td>탑재 모델</td>
        <td>Gemini 3.1 Pro (High)</td>
      </tr>
      <tr>
        <td>보유 기술</td>
        <td>android-native, google-native, emulator-qa, device-qa, perf, crash-analysis, multimodal-render</td>
      </tr>
      <tr>
        <td>현재 상태</td>
        <td>활성</td>
      </tr>
    </tbody>
  </table>

  <div class="button-container">
    <button type="button">닫기</button>
  </div>
</body>
</html>
