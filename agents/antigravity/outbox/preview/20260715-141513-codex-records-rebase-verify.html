<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; padding: 2rem; line-height: 1.6; }
  h1, h2 { color: #4CAF50; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #333; padding: 0.75rem; text-align: left; }
  th { background-color: #1E1E1E; }
  button { background-color: #4CAF50; color: #121212; border: none; padding: 0.5rem 1rem; cursor: pointer; font-weight: bold; }
  button:hover { background-color: #45a049; }
</style>
<title>안티그래비티 검증 보고서</title>
</head>
<body>
  <h1>안티그래비티 검증 보고서</h1>
  <h2>요약</h2>
  <p>코덱스의 레코드 소스 상세 라우트 재배치 작업에 대한 교차 검증을 완료했습니다.</p>
  
  <h2>검증 결과</h2>
  <table>
    <thead>
      <tr>
        <th>항목</th>
        <th>결과</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>본류 조상 확인</td>
        <td>통과 (참)</td>
      </tr>
      <tr>
        <td>타입 및 구문 검사</td>
        <td>통과 (오류 0건)</td>
      </tr>
      <tr>
        <td>상세 읽기 전용 동작</td>
        <td>통과</td>
      </tr>
    </tbody>
  </table>
  
  <h2>결론</h2>
  <p>해당 브랜치는 이상이 없으며 머지 조건에 부합합니다.</p>
  <button type="button">승인</button>
</body>
</html>
