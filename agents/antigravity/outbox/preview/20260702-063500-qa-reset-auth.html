<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>QA 검증 리포트</title>
<style>
  body {
    background-color: #0F1115;
    color: #FFFFFF;
    font-family: sans-serif;
    margin: 40px;
    line-height: 1.6;
  }
  h1, h2 {
    color: #FFFFFF;
    border-bottom: 1px solid #4A90E2;
    padding-bottom: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #4A90E2;
    padding: 12px;
    text-align: left;
  }
  th {
    background-color: #4A90E2;
    color: #0F1115;
  }
  button {
    background-color: #4A90E2;
    color: #0F1115;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 20px;
  }
  .caption {
    font-size: 0.9em;
    color: #4A90E2;
    margin-top: 5px;
  }
</style>
</head>
<body>
  <h1>네이티브 에뮬레이터 QA 검증 리포트</h1>
  <p>검증 환경: 안드로이드 에뮬레이터 (메인 브랜치 최신화 기준)</p>
  
  <h2>검증 항목 및 결과</h2>
  <table>
    <thead>
      <tr>
        <th>검증 대상</th>
        <th>상태</th>
        <th>비고</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>초기화 플로우 재검증</td>
        <td>통과</td>
        <td>버그 없음</td>
      </tr>
      <tr>
        <td>권한 상승 경계 검증</td>
        <td>통과</td>
        <td>스윕 없이 의도된 하드 섀도우 확인</td>
      </tr>
      <tr>
        <td>네트워크 지연 화면 검증</td>
        <td>통과</td>
        <td>게스트 계정에서만 발생, 인증 시 정상</td>
      </tr>
    </tbody>
  </table>

  <div class="caption">표 1: 런타임 기능 검증 상세 결과 요약</div>

  <button type="button">확인 완료</button>
</body>
</html>
